<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Pro - 自动化测试执行报告</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2d3436;
            --light: #f8f9fa;
            --border: #edf2f7;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: var(--dark);
            min-width: 1200px; /* 保证产品化布局不乱 */
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* --- 头部看板 --- */
        header {
            background: linear-gradient(135deg, var(--dark) 0%, #000 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .env-tag {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-right: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- 统计卡片 --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-bottom: 4px solid #eee;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card.pass { border-color: var(--success); }
        .stat-card.fail { border-color: var(--danger); }
        .stat-card.skip { border-color: var(--warning); }

        .stat-val { font-size: 28px; font-weight: 800; display: block; }
        .stat-label { color: #718096; font-size: 14px; }

        /* --- 控制栏 --- */
        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .search-box {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 300px;
            outline: none;
        }

        .filter-group .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            border-radius: 6px;
            margin-left: 5px;
            font-weight: 500;
        }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- 表格样式 --- */
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 15px 20px; text-align: left; font-size: 13px; color: #64748b; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:last-child td { border: none; }
        tr.fail-row { background: #fff5f5; }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: white;
        }
        .bg-pass { background: var(--success); }
        .bg-fail { background: var(--danger); }
        .bg-skip { background: var(--warning); }

        /* 详情折叠区 */
        .detail-row { display: none; background: #2d3436; color: #fab005; font-family: monospace; padding: 15px; }
        .detail-content { padding: 20px; white-space: pre-wrap; font-size: 12px; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0; font-size: 24px;">Regression Suite - Result</h1>
            <div style="margin-top: 10px;">
                <span class="env-tag">Env: Production-Mirror</span>
                <span class="env-tag">Browser: Chrome 120</span>
                <span class="env-tag">Executor: GitLab Runner #5502</span>
            </div>
        </div>
        <div style="text-align: right">
            <div style="font-size: 20px; font-weight: bold;">80.0% Pass Rate</div>
            <div style="opacity: 0.6; font-size: 12px;">Duration: 03:45m</div>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-card">
            <span class="stat-val">30</span>
            <span class="stat-label">Total Cases</span>
        </div>
        <div class="stat-card pass">
            <span class="stat-val" style="color:var(--success)">24</span>
            <span class="stat-label">Passed</span>
        </div>
        <div class="stat-card fail">
            <span class="stat-val" style="color:var(--danger)">4</span>
            <span class="stat-label">Failed</span>
        </div>
        <div class="stat-card skip">
            <span class="stat-val" style="color:var(--warning)">2</span>
            <span class="stat-label">Skipped</span>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="搜索模块或场景名称..." onkeyup="filterTable()">
        <div class="filter-group" id="filterGroup">
            <button class="btn active" onclick="filterStatus('all', this)">All</button>
            <button class="btn" onclick="filterStatus('PASS', this)">Pass</button>
            <button class="btn" onclick="filterStatus('FAIL', this)">Fail</button>
            <button class="btn" onclick="filterStatus('SKIP', this)">Skip</button>
        </div>
    </div>

    <div class="table-container">
        <table id="testTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Module</th>
                    <th>Scenario</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // 1. 模拟 30 条产品化数据
    const testData = [
        {id: 'TC-01', module: 'Auth', name: 'Valid User Login', time: '1.2s', status: 'PASS'},
        {id: 'TC-02', module: 'Auth', name: 'Invalid Password Error', time: '0.8s', status: 'PASS'},
        {id: 'TC-03', module: 'Auth', name: 'SQL Injection Prevention', time: '2.5s', status: 'FAIL', log: 'AssertionError: Expected 403 but got 500\nStacktrace:\n  at login_page.py:45\n  at test_auth.py:12'},
        {id: 'TC-04', module: 'Auth', name: 'Captcha Expiry', time: '0.5s', status: 'PASS'},
        {id: 'TC-05', module: 'Cart', name: 'Add Product to Cart', time: '1.5s', status: 'PASS'},
        {id: 'TC-06', module: 'Cart', name: 'Update Quantity', time: '1.1s', status: 'PASS'},
        {id: 'TC-07', module: 'Cart', name: 'Remove Item', time: '0.9s', status: 'PASS'},
        {id: 'TC-08', module: 'Cart', name: 'Clear All Items', time: '3.2s', status: 'FAIL', log: 'TimeoutException: Element not found after 3000ms\n  at cart_service.js:88'},
        {id: 'TC-09', module: 'Pay', name: 'Balance Payment Success', time: '2.1s', status: 'PASS'},
        {id: 'TC-10', module: 'Pay', name: 'Insufficient Funds', time: '1.8s', status: 'PASS'},
        {id: 'TC-11', module: 'Pay', name: 'Credit Card Gateway', time: '4.5s', status: 'FAIL', log: 'RuntimeError: Socket disconnected prematurely'},
        {id: 'TC-12', module: 'Order', name: 'Create Order - Normal', time: '2.0s', status: 'PASS'},
        {id: 'TC-13', module: 'Order', name: 'Stock Locking Test', time: '1.4s', status: 'PASS'},
        {id: 'TC-14', module: 'Order', name: 'Auto Close Timeout', time: '-', status: 'SKIP'},
        {id: 'TC-15', module: 'Order', name: 'Batch Export CSV', time: '5.2s', status: 'PASS'},
    ];

    // 补全至 30 条
    for(let i=16; i<=30; i++) {
        testData.push({
            id: `TC-${i}`,
            module: 'System',
            name: `Performance Benchmarking Case ${i}`,
            time: '0.3s',
            status: i === 25 ? 'FAIL' : (i === 30 ? 'SKIP' : 'PASS'),
            log: i === 25 ? 'Memory Leak Detected in Sandbox' : null
        });
    }

    // 2. 渲染表格
    function renderTable(data) {
        const body = document.getElementById('tableBody');
        body.innerHTML = data.map(item => `
            <tr class="${item.status === 'FAIL' ? 'fail-row' : ''}" data-status="${item.status}">
                <td>${item.id}</td>
                <td style="font-weight:bold; color:var(--primary)">${item.module}</td>
                <td>${item.name}</td>
                <td>${item.time}</td>
                <td><span class="badge bg-${item.status.toLowerCase()}">${item.status}</span></td>
                <td>
                    ${item.log ? `<button onclick="toggleLog('${item.id}')" style="font-size:11px; cursor:pointer">View Log</button>` : '-'}
                </td>
            </tr>
            ${item.log ? `<tr id="log-${item.id}" class="detail-row"><td colspan="6"><div class="detail-content">${item.log}</div></td></tr>` : ''}
        `).join('');
    }

    // 3. 筛选逻辑
    let currentFilter = 'all';
    
    function filterStatus(status, btn) {
        currentFilter = status;
        // 更新按钮 UI
        document.querySelectorAll('.filter-group .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        executeFilter();
    }

    function filterTable() {
        executeFilter();
    }

    function executeFilter() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr:not(.detail-row)');
        
        rows.forEach(row => {
            const status = row.getAttribute('data-status');
            const text = row.innerText.toLowerCase();
            
            const matchStatus = (currentFilter === 'all' || status === currentFilter);
            const matchSearch = text.includes(searchText);
            
            row.style.display = (matchStatus && matchSearch) ? '' : 'none';
        });
    }

    function toggleLog(id) {
        const logRow = document.getElementById(`log-${id}`);
        logRow.style.display = logRow.style.display === 'table-row' ? 'none' : 'table-row';
    }

    // 初始化渲染
    renderTable(testData);
</script>

</body>
</html>
